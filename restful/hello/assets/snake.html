<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .score-display {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .score-value {
            color: #00ff88;
            font-size: 28px;
        }

        .high-score {
            color: #ffd700;
            font-size: 16px;
        }

        #gameCanvas {
            border: 4px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.3),
                        inset 0 0 50px rgba(0, 0, 0, 0.3);
            background: #0a0a1a;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .overlay.hidden {
            display: none;
        }

        .overlay-title {
            font-size: 48px;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
            margin-bottom: 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        .overlay-subtitle {
            font-size: 24px;
            color: #fff;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.6;
        }

        .final-score {
            font-size: 36px;
            color: #ffd700;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 20px;
            color: #fff;
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 255, 136, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .instructions {
            color: #aaa;
            font-size: 14px;
            margin-top: 30px;
            text-align: center;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .game-over-title {
            color: #ff4757;
            text-shadow: 0 0 20px rgba(255, 71, 87, 0.8);
        }

        .mockery-text {
            font-size: 24px;
            color: #ff6b6b;
            margin-bottom: 20px;
            font-style: italic;
            animation: fadeInUp 0.5s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 吃食物时的反馈 */
        .food-feedback {
            position: fixed;
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.9), 0 0 30px rgba(255, 215, 0, 0.5);
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 200;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-30px) scale(1.3);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.5);
            }
        }

        /* 分数弹出动画 */
        @keyframes scorePopIn {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); color: #ffd700; }
            100% { transform: scale(1); }
        }

        .score-pop {
            animation: scorePopIn 0.3s ease-out;
        }

        /* 游戏结束时抖动效果 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-15px) rotate(-2deg); }
            40% { transform: translateX(15px) rotate(2deg); }
            60% { transform: translateX(-10px) rotate(-1deg); }
            80% { transform: translateX(10px) rotate(1deg); }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        /* 吃到食物时画布闪一下 */
        @keyframes canvasFlash {
            0% { box-shadow: 0 0 30px rgba(0, 255, 136, 0.3), inset 0 0 50px rgba(0, 0, 0, 0.3); }
            50% { box-shadow: 0 0 60px rgba(255, 215, 0, 0.8), inset 0 0 30px rgba(255, 215, 0, 0.3); }
            100% { box-shadow: 0 0 30px rgba(0, 255, 136, 0.3), inset 0 0 50px rgba(0, 0, 0, 0.3); }
        }

        .canvas-flash {
            animation: canvasFlash 0.3s ease-out;
        }

        @media (max-width: 500px) {
            .header {
                padding: 8px 15px;
            }
            .score-display {
                font-size: 18px;
            }
            .score-value {
                font-size: 22px;
            }
            .high-score {
                font-size: 14px;
            }
            .overlay-title {
                font-size: 36px;
            }
            .overlay-subtitle {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="score-display">
                分数: <span class="score-value" id="score">0</span>
            </div>
            <div class="high-score">
                最高分: <span id="highScore">0</span>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 开始界面 -->
    <div class="overlay" id="startOverlay">
        <div class="overlay-title">🐍 贪吃蛇</div>
        <div class="overlay-subtitle">
            使用方向键或滑动控制蛇的移动<br>
            吃到食物获得分数
        </div>
        <button class="btn" id="startBtn">开始游戏</button>
        <div class="instructions">
            按空格键或点击按钮开始
        </div>
    </div>

    <!-- 游戏结束界面 -->
    <div class="overlay hidden" id="gameOverOverlay">
        <div class="overlay-title game-over-title">游戏结束</div>
        <div class="mockery-text" id="mockeryText"></div>
        <div class="final-score">
            最终得分: <span id="finalScore">0</span>
        </div>
        <button class="btn" id="restartBtn">再来一局</button>
    </div>

    <script>
        // 游戏配置
        const CONFIG = {
            gridSize: 20,
            initialSpeed: 150,
            speedIncrease: 2,
            minSpeed: 50,
            scorePerFood: 10
        };

        // 游戏状态
        const GAME_STATE = {
            STOPPED: 'stopped',
            RUNNING: 'running',
            PAUSED: 'paused',
            GAME_OVER: 'gameOver'
        };

        // 嘲讽语列表（根据分数等级选择）
        const MOCKERY_PHRASES = {
            low: [
                "你好菜呀 😂",
                "就这？🐔",
                "回去练练吧",
                "蛇都比你聪明 🐍",
                "手残党实锤",
                "建议改玩俄罗斯方块",
                "蚂蚁都比你走得好",
                "蛇：我自己撞墙的 😢"
            ],
            medium: [
                "还行吧，普信男 😏",
                "勉强及格，别骄傲",
                "再接再厉？呵呵",
                "有点东西，但不多",
                "蛇：谢谢你送我一程 🙏",
                "这成绩...我都不好意思说了",
                "比刚才进步了0.1秒 🎉",
                "继续加油（敷衍）"
            ],
            high: [
                "厉害个位数玩家 💪",
                "就差一点点！真的！",
                "蛇都佩服你的稳定性",
                "这个分数很安全（不是）",
                "恭喜达到平均水平 🎯",
                "稳定发挥，一如既往",
                "分数很吉利：）",
                "你的蛇走得很安详 🪦"
            ]
        };

        // 吃到食物时的鼓励语
        const FOOD_COMMENTS = [
            "好吃！😋",
            "真香！",
            "+10 🎉",
            "妙啊！",
            "绝了！✨",
            "漂亮！💯",
            "完美！",
            "666"
        ];

        // 贪吃蛇游戏类
        class SnakeGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.scoreElement = document.getElementById('score');
                this.highScoreElement = document.getElementById('highScore');
                this.startOverlay = document.getElementById('startOverlay');
                this.gameOverOverlay = document.getElementById('gameOverOverlay');
                this.finalScoreElement = document.getElementById('finalScore');
                this.mockeryElement = document.getElementById('mockeryText');
                this.startBtn = document.getElementById('startBtn');
                this.restartBtn = document.getElementById('restartBtn');

                this.init();
                this.bindEvents();
                this.loadHighScore();
            }

            init() {
                // 设置画布大小
                this.resizeCanvas();
                window.addEventListener('resize', () => this.resizeCanvas());

                // 初始化游戏状态
                this.state = GAME_STATE.STOPPED;
                this.score = 0;
                this.speed = CONFIG.initialSpeed;
                this.lastMoveTime = 0;

                // 初始化蛇
                this.snake = [
                    { x: 5, y: 10 },
                    { x: 4, y: 10 },
                    { x: 3, y: 10 }
                ];
                this.direction = { x: 1, y: 0 };
                this.nextDirection = { x: 1, y: 0 };

                // 生成食物
                this.food = this.generateFood();

                // 渲染初始画面
                this.render();
            }

            resizeCanvas() {
                const maxWidth = Math.min(window.innerWidth - 40, 400);
                const maxHeight = Math.min(window.innerHeight - 200, 400);
                const size = Math.min(maxWidth, maxHeight);

                this.canvas.width = size;
                this.canvas.height = size;
                this.cellSize = size / CONFIG.gridSize;

                if (this.state === GAME_STATE.STOPPED) {
                    this.render();
                }
            }

            bindEvents() {
                // 键盘控制
                document.addEventListener('keydown', (e) => this.handleKeydown(e));

                // 触摸控制
                let touchStartX = 0;
                let touchStartY = 0;

                this.canvas.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                }, { passive: true });

                this.canvas.addEventListener('touchend', (e) => {
                    if (this.state !== GAME_STATE.RUNNING) return;

                    const touchEndX = e.changedTouches[0].clientX;
                    const touchEndY = e.changedTouches[0].clientY;

                    const dx = touchEndX - touchStartX;
                    const dy = touchEndY - touchStartY;

                    if (Math.abs(dx) > Math.abs(dy)) {
                        // 水平滑动
                        if (dx > 30 && this.direction.x !== -1) {
                            this.nextDirection = { x: 1, y: 0 };
                        } else if (dx < -30 && this.direction.x !== 1) {
                            this.nextDirection = { x: -1, y: 0 };
                        }
                    } else {
                        // 垂直滑动
                        if (dy > 30 && this.direction.y !== -1) {
                            this.nextDirection = { x: 0, y: 1 };
                        } else if (dy < -30 && this.direction.y !== 1) {
                            this.nextDirection = { x: 0, y: -1 };
                        }
                    }
                }, { passive: true });

                // 按钮事件
                this.startBtn.addEventListener('click', () => this.start());
                this.restartBtn.addEventListener('click', () => this.restart());

                // 点击画布开始游戏
                this.canvas.addEventListener('click', () => {
                    if (this.state === GAME_STATE.STOPPED) {
                        this.start();
                    }
                });
            }

            handleKeydown(e) {
                // 空格键开始/暂停
                if (e.code === 'Space') {
                    e.preventDefault();
                    if (this.state === GAME_STATE.STOPPED) {
                        this.start();
                    } else if (this.state === GAME_STATE.RUNNING) {
                        this.pause();
                    } else if (this.state === GAME_STATE.PAUSED) {
                        this.resume();
                    } else if (this.state === GAME_STATE.GAME_OVER) {
                        this.restart();
                    }
                    return;
                }

                // 方向键控制
                if (this.state !== GAME_STATE.RUNNING) return;

                switch (e.code) {
                    case 'ArrowUp':
                    case 'KeyW':
                        if (this.direction.y !== 1) {
                            this.nextDirection = { x: 0, y: -1 };
                        }
                        break;
                    case 'ArrowDown':
                    case 'KeyS':
                        if (this.direction.y !== -1) {
                            this.nextDirection = { x: 0, y: 1 };
                        }
                        break;
                    case 'ArrowLeft':
                    case 'KeyA':
                        if (this.direction.x !== 1) {
                            this.nextDirection = { x: -1, y: 0 };
                        }
                        break;
                    case 'ArrowRight':
                    case 'KeyD':
                        if (this.direction.x !== -1) {
                            this.nextDirection = { x: 1, y: 0 };
                        }
                        break;
                }
            }

            start() {
                this.state = GAME_STATE.RUNNING;
                this.startOverlay.classList.add('hidden');
                this.lastMoveTime = performance.now();
                this.gameLoop();
            }

            pause() {
                this.state = GAME_STATE.PAUSED;
            }

            resume() {
                this.state = GAME_STATE.RUNNING;
                this.lastMoveTime = performance.now();
                this.gameLoop();
            }

            restart() {
                this.gameOverOverlay.classList.add('hidden');
                this.init();
                this.start();
            }

            getRandomMockery() {
                // 根据分数选择嘲讽语等级
                let tier;
                if (this.score < 30) {
                    tier = 'low';
                } else if (this.score < 80) {
                    tier = 'medium';
                } else {
                    tier = 'high';
                }
                const phrases = MOCKERY_PHRASES[tier];
                return phrases[Math.floor(Math.random() * phrases.length)];
            }

            gameOver() {
                this.state = GAME_STATE.GAME_OVER;
                this.finalScoreElement.textContent = this.score;

                // 显示嘲讽语
                this.mockeryElement.textContent = this.getRandomMockery();

                // 画布抖动效果
                this.canvas.classList.add('shake');
                setTimeout(() => {
                    this.canvas.classList.remove('shake');
                }, 500);

                this.saveHighScore();
                this.gameOverOverlay.classList.remove('hidden');
            }

            // 显示吃食物的视觉反馈
            showFoodFeedback() {
                // 1. 画布边框闪金色
                this.canvas.classList.add('canvas-flash');
                setTimeout(() => {
                    this.canvas.classList.remove('canvas-flash');
                }, 300);

                // 2. 分数弹出动画
                this.scoreElement.classList.add('score-pop');
                setTimeout(() => {
                    this.scoreElement.classList.remove('score-pop');
                }, 300);

                // 3. 浮动文字反馈
                const feedback = document.createElement('div');
                feedback.className = 'food-feedback';
                feedback.textContent = FOOD_COMMENTS[Math.floor(Math.random() * FOOD_COMMENTS.length)];

                // 位置在画布中央上方
                const rect = this.canvas.getBoundingClientRect();
                feedback.style.left = (rect.left + rect.width / 2 - 30) + 'px';
                feedback.style.top = (rect.top + rect.height / 2 - 20) + 'px';

                document.body.appendChild(feedback);

                // 动画结束后移除元素
                setTimeout(() => {
                    feedback.remove();
                }, 800);
            }

            generateFood() {
                let food;
                do {
                    food = {
                        x: Math.floor(Math.random() * CONFIG.gridSize),
                        y: Math.floor(Math.random() * CONFIG.gridSize)
                    };
                } while (this.snake.some(segment => segment.x === food.x && segment.y === food.y));
                return food;
            }

            update() {
                // 更新方向
                this.direction = { ...this.nextDirection };

                // 计算新的头部位置
                const head = {
                    x: this.snake[0].x + this.direction.x,
                    y: this.snake[0].y + this.direction.y
                };

                // 检测墙壁碰撞
                if (head.x < 0 || head.x >= CONFIG.gridSize ||
                    head.y < 0 || head.y >= CONFIG.gridSize) {
                    this.gameOver();
                    return;
                }

                // 检测自身碰撞
                if (this.snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                    this.gameOver();
                    return;
                }

                // 添加新头部
                this.snake.unshift(head);

                // 检测是否吃到食物
                if (head.x === this.food.x && head.y === this.food.y) {
                    this.score += CONFIG.scorePerFood;
                    this.scoreElement.textContent = this.score;
                    this.food = this.generateFood();

                    // 显示吃食物的视觉反馈
                    this.showFoodFeedback();

                    // 增加速度
                    if (this.speed > CONFIG.minSpeed) {
                        this.speed = Math.max(CONFIG.minSpeed, this.speed - CONFIG.speedIncrease);
                    }
                } else {
                    // 移除尾部
                    this.snake.pop();
                }
            }

            render() {
                const ctx = this.ctx;
                const cellSize = this.cellSize;

                // 清空画布
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // 绘制网格
                ctx.strokeStyle = 'rgba(0, 255, 136, 0.1)';
                ctx.lineWidth = 0.5;
                for (let i = 0; i <= CONFIG.gridSize; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * cellSize, 0);
                    ctx.lineTo(i * cellSize, this.canvas.height);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * cellSize);
                    ctx.lineTo(this.canvas.width, i * cellSize);
                    ctx.stroke();
                }

                // 绘制食物
                const foodGradient = ctx.createRadialGradient(
                    this.food.x * cellSize + cellSize / 2,
                    this.food.y * cellSize + cellSize / 2,
                    0,
                    this.food.x * cellSize + cellSize / 2,
                    this.food.y * cellSize + cellSize / 2,
                    cellSize / 2
                );
                foodGradient.addColorStop(0, '#ff6b6b');
                foodGradient.addColorStop(1, '#ee5a5a');

                ctx.fillStyle = foodGradient;
                ctx.beginPath();
                ctx.arc(
                    this.food.x * cellSize + cellSize / 2,
                    this.food.y * cellSize + cellSize / 2,
                    cellSize / 2 - 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();

                // 绘制食物光晕
                ctx.shadowColor = '#ff6b6b';
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;

                // 绘制蛇身
                this.snake.forEach((segment, index) => {
                    const progress = index / this.snake.length;
                    const r = Math.floor(0 + progress * 0);
                    const g = Math.floor(255 - progress * 100);
                    const b = Math.floor(136 - progress * 50);

                    if (index === 0) {
                        // 蛇头
                        const headGradient = ctx.createRadialGradient(
                            segment.x * cellSize + cellSize / 2,
                            segment.y * cellSize + cellSize / 2,
                            0,
                            segment.x * cellSize + cellSize / 2,
                            segment.y * cellSize + cellSize / 2,
                            cellSize / 2
                        );
                        headGradient.addColorStop(0, '#00ff88');
                        headGradient.addColorStop(1, '#00cc6a');
                        ctx.fillStyle = headGradient;
                    } else {
                        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    }

                    const padding = 1;
                    const radius = 4;
                    this.roundRect(
                        ctx,
                        segment.x * cellSize + padding,
                        segment.y * cellSize + padding,
                        cellSize - padding * 2,
                        cellSize - padding * 2,
                        radius
                    );
                    ctx.fill();
                });

                // 绘制蛇头光晕
                ctx.shadowColor = '#00ff88';
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#00ff88';
                ctx.beginPath();
                ctx.arc(
                    this.snake[0].x * cellSize + cellSize / 2,
                    this.snake[0].y * cellSize + cellSize / 2,
                    cellSize / 4,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
                ctx.shadowBlur = 0;

                // 绘制眼睛
                const eyeOffset = cellSize / 4;
                const eyeSize = cellSize / 8;
                ctx.fillStyle = '#000';

                let eye1X, eye1Y, eye2X, eye2Y;
                const centerX = this.snake[0].x * cellSize + cellSize / 2;
                const centerY = this.snake[0].y * cellSize + cellSize / 2;

                if (this.direction.x === 1) {
                    eye1X = centerX + eyeOffset / 2;
                    eye1Y = centerY - eyeOffset / 2;
                    eye2X = centerX + eyeOffset / 2;
                    eye2Y = centerY + eyeOffset / 2;
                } else if (this.direction.x === -1) {
                    eye1X = centerX - eyeOffset / 2;
                    eye1Y = centerY - eyeOffset / 2;
                    eye2X = centerX - eyeOffset / 2;
                    eye2Y = centerY + eyeOffset / 2;
                } else if (this.direction.y === -1) {
                    eye1X = centerX - eyeOffset / 2;
                    eye1Y = centerY - eyeOffset / 2;
                    eye2X = centerX + eyeOffset / 2;
                    eye2Y = centerY - eyeOffset / 2;
                } else {
                    eye1X = centerX - eyeOffset / 2;
                    eye1Y = centerY + eyeOffset / 2;
                    eye2X = centerX + eyeOffset / 2;
                    eye2Y = centerY + eyeOffset / 2;
                }

                ctx.beginPath();
                ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI * 2);
                ctx.fill();
            }

            roundRect(ctx, x, y, width, height, radius) {
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
            }

            gameLoop(currentTime = 0) {
                if (this.state !== GAME_STATE.RUNNING) return;

                requestAnimationFrame((time) => this.gameLoop(time));

                if (currentTime - this.lastMoveTime >= this.speed) {
                    this.update();
                    this.render();
                    this.lastMoveTime = currentTime;
                }
            }

            loadHighScore() {
                const saved = localStorage.getItem('snakeHighScore');
                if (saved) {
                    this.highScore = parseInt(saved);
                    this.highScoreElement.textContent = this.highScore;
                }
            }

            saveHighScore() {
                if (this.score > this.highScore) {
                    this.highScore = this.score;
                    localStorage.setItem('snakeHighScore', this.highScore.toString());
                    this.highScoreElement.textContent = this.highScore;
                }
            }
        }

        // 初始化游戏
        window.addEventListener('DOMContentLoaded', () => {
            new SnakeGame();
        });
    </script>
</body>
</html>
