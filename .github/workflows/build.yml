name: Build

on:
  workflow_dispatch:

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  # 阿里云相关配置
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAMESPACE: my-quantum  # 替换为你阿里云创建的命名空间

permissions:
  contents: read
  packages: write

jobs:
  # --- API 构建任务 ---
  build-api:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: lowercase repo
        id: repo
        run: echo "repo=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: login ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 新增：登录阿里云 ACR
      - name: login aliyun
        run: echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login ${{ env.ALIYUN_REGISTRY }} -u ${{ secrets.ALIYUN_USERNAME }} --password-stdin

      - name: build and push restful images
        run: |
          for dir in restful/*/; do
            if [ -f "${dir}Dockerfile" ]; then
              service_name=$(basename "$dir")
          
              # GHCR 镜像名
              ghcr_tag="ghcr.io/${{ steps.repo.outputs.repo }}/${service_name}-api:${{ github.sha }}"
              # 阿里云镜像名
              aliyun_tag="${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${service_name}-api:${{ github.sha }}"
          
              echo "🔨 Building API: $service_name"
              docker build -t "$ghcr_tag" -t "$aliyun_tag" -f "${dir}Dockerfile" .
          
              echo "🚀 Pushing to GHCR..."
              docker push "$ghcr_tag"
          
              echo "🚀 Pushing to Aliyun..."
              docker push "$aliyun_tag"
            fi
          done

  # --- RPC 构建任务 ---
  build-rpc:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: lowercase repo
        id: repo
        run: echo "repo=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: login ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 新增：登录阿里云 ACR
      - name: login aliyun
        run: echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login ${{ env.ALIYUN_REGISTRY }} -u ${{ secrets.ALIYUN_USERNAME }} --password-stdin

      - name: build and push rpc images
        run: |
          for dir in service/*/; do
            if [ -f "${dir}Dockerfile" ]; then
              service_name=$(basename "$dir")
          
              # GHCR 镜像名
              ghcr_tag="ghcr.io/${{ steps.repo.outputs.repo }}/${service_name}-rpc:${{ github.sha }}"
              # 阿里云镜像名
              aliyun_tag="${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${service_name}-rpc:${{ github.sha }}"
          
              echo "🔨 Building RPC: $service_name"
              docker build -t "$ghcr_tag" -t "$aliyun_tag" -f "${dir}Dockerfile" .
          
              echo "🚀 Pushing to GHCR..."
              docker push "$ghcr_tag"
          
              echo "🚀 Pushing to Aliyun..."
              docker push "$aliyun_tag"
            fi
          done