name: Deploy

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

  workflow_dispatch:   # ✅ 手动触发

env:
  # 从 Secrets 中动态读取，保证与 Build 脚本完全一致
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAMESPACE: ${{ secrets.ALIYUN_NAMESPACE }}

jobs:
  deploy:
    # ✅ 防止 build 失败也触发 deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > ~/.kube/config

      - name: test cluster connection
        run: |
          kubectl get nodes

      - name: lowercase repo
        id: repo
        run: echo "repo=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: set tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            # 如果是 Build 流程触发的，获取 Build 流程那个 commit 的 SHA
            echo "IMG_TAG=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV
          else
            # 如果是手动触发 (workflow_dispatch)，获取当前分支最新的 commit SHA
            echo "IMG_TAG=${{ github.sha }}" >> $GITHUB_ENV
          fi

      # ✅ 自动化部署所有 RPC 服务
      - name: deploy all rpc services
        run: |
          for yaml in build/k8s/*-rpc.yaml; do
            if [ -f "$yaml" ]; then
              filename=$(basename "$yaml" .yaml)
              service_name=${filename%-rpc}
          
              echo "🚀 Deploying RPC Service: $service_name"
          
              # 使用环境变量拼接出完整的阿里云镜像地址
              FULL_IMAGE_NAME="${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${service_name}-rpc:${{ env.IMG_TAG }}"
          
              echo "🏷️ Using Image: $FULL_IMAGE_NAME"
          
              # 动态替换 YAML 中的镜像地址
              sed -i "s|image: .*$service_name-rpc.*|image: $FULL_IMAGE_NAME|g" "$yaml"
          
              # 执行 K8s 部署
              kubectl apply -f "$yaml"
          
              # 等待就绪
              echo "⏳ Waiting for $filename rollout..."
              kubectl rollout status deployment/$filename -n default --timeout=180s
            fi
          done

      # ✅ 自动化部署所有 API 服务
      - name: deploy all api services
        run: |
          for yaml in build/k8s/*-api.yaml; do
            if [ -f "$yaml" ]; then
              filename=$(basename "$yaml" .yaml)
              service_name=${filename%-api}
          
              echo "🚀 Deploying API Service: $service_name"
          
              # 使用环境变量拼接出完整的阿里云镜像地址
              FULL_IMAGE_NAME="${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${service_name}-api:${{ env.IMG_TAG }}"
          
              echo "🏷️ Using Image: $FULL_IMAGE_NAME"
          
              # 动态替换 YAML 中的镜像地址
              sed -i "s|image: .*$service_name-api.*|image: $FULL_IMAGE_NAME|g" "$yaml"
          
              # 执行 K8s 部署
              kubectl apply -f "$yaml"
          
              # 等待就绪
              echo "⏳ Waiting for $filename rollout..."
              kubectl rollout status deployment/$filename -n default --timeout=180s
            fi
          done